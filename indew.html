<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gartic Party Online - 8 Joueurs</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #setup { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; text-align: center; font-size: 1.1em; background: #0f172a; color: #38bdf8; border: 1px solid #334155; }
        .btn { background: #38bdf8; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 1em; }
        .btn-start { background: #22c55e; margin-top: 20px; display: none; }
        canvas { background: #000; display: none; border: 4px solid #334155; border-radius: 8px; }
        #status { position: absolute; top: 15px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="status">Statut: En attente...</div>

    <div id="setup">
        <h1 style="margin-top:0;">LOBBY ONLINE</h1>
        <p>Ton Code Salon : <br><b id="my-id" style="color:#38bdf8; font-size: 1.4em;">Connexion...</b></p>
        <input type="text" id="join-id" placeholder="Coller le code de l'ami ici">
        <button class="btn" onclick="joinRoom()">REJOINDRE LE SALON</button>
        <div id="info" style="margin-top:15px; color:#94a3b8;">Connecte-toi pour jouer à 8 !</div>
        <button id="startBtn" class="btn btn-start" onclick="hostStart()">LANCER LA PARTIE</button>
    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const peer = new Peer();
const statusEl = document.getElementById('status');

let myId = null;
let connections = []; // Liste des clients pour l'hôte
let mainConn = null;  // Connexion vers l'hôte pour le client
let isHost = false;
let myIndex = 0;

// Structure des 8 joueurs
const colors = ['#ef4444', '#22c55e', '#3b82f6', '#eab308', '#a855f7', '#06b6d4', '#f97316', '#fcd34d'];
let players = Array.from({length: 8}, (_, i) => ({
    id: i, x: 100 + i*100, y: 300, color: colors[i], active: false
}));

// --- RÉSEAU PEERJS ---
peer.on('open', (id) => {
    myId = id;
    document.getElementById('my-id').innerText = id;
    statusEl.innerText = "Prêt à héberger ou rejoindre.";
});

// L'HÔTE reçoit une connexion
peer.on('connection', (conn) => {
    isHost = true;
    connections.push(conn);
    myIndex = 0; 
    players[0].active = true;
    
    conn.on('open', () => {
        const guestIndex = connections.length;
        players[guestIndex].active = true;
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('info').innerText = (connections.length + 1) + " joueurs dans le lobby";
        
        // Envoi de l'ID au nouveau joueur
        conn.send({ type: 'ASSIGN_ID', index: guestIndex });
        
        setupDataListener(conn);
    });
});

// LE CLIENT rejoint
function joinRoom() {
    const targetId = document.getElementById('join-id').value;
    if(!targetId) return;
    
    mainConn = peer.connect(targetId);
    mainConn.on('open', () => {
        document.getElementById('setup').innerHTML = "<h2>Connecté !</h2><p>Attente du lancement par l'hôte...</p>";
        setupDataListener(mainConn);
    });
}

function setupDataListener(conn) {
    conn.on('data', (data) => {
        if(data.type === 'ASSIGN_ID') {
            myIndex = data.index;
            players[myIndex].active = true;
        }
        if(data.type === 'START') {
            initGame();
        }
        if(data.type === 'SYNC') {
            // On met à jour tous les joueurs sauf soi-même
            data.players.forEach((p, i) => {
                if(i !== myIndex) {
                    players[i].x = p.x;
                    players[i].y = p.y;
                    players[i].active = p.active;
                }
            });
        }
    });
}

// --- LOGIQUE DE JEU ---
let keys = {};
window.onkeydown = e => keys[e.key.toLowerCase()] = true;
window.onkeyup = e => keys[e.key.toLowerCase()] = false;

function hostStart() {
    connections.forEach(c => c.send({ type: 'START' }));
    initGame();
}

function initGame() {
    document.getElementById('setup').style.display = 'none';
    canvas.style.display = 'block';
    statusEl.innerText = "Partie en cours - Joueur " + (myIndex + 1);
    gameLoop();
}

function update() {
    let p = players[myIndex];
    if(keys['z'] || keys['arrowup']) p.y -= 5;
    if(keys['s'] || keys['arrowdown']) p.y += 5;
    if(keys['q'] || keys['arrowleft']) p.x -= 5;
    if(keys['d'] || keys['arrowright']) p.x += 5;

    // Limites de l'écran
    p.x = Math.max(20, Math.min(980, p.x));
    p.y = Math.max(20, Math.min(580, p.y));

    // Envoi de la position aux autres
    const syncData = { type: 'SYNC', players: players };
    if(isHost) {
        connections.forEach(c => c.send(syncData));
    } else if(mainConn) {
        mainConn.send(syncData);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Dessiner les joueurs actifs
    players.forEach(p => {
        if(p.active) {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 20, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText("J" + (p.id + 1), p.x, p.y - 30);
        }
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
