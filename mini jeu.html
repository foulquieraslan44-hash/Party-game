<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mega Party 10 - Lobby & Jeux</title>
    <style>
        :root { --bg: #0f0c29; --accent: #00d2ff; }
        body { background: var(--bg); color: white; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); }
        .pin-container { background: white; color: #1a1a2e; padding: 20px 50px; border-radius: 15px; font-size: 40px; font-weight: bold; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 90%; max-width: 1000px; }
        .player-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; text-align: center; border: 3px solid transparent; transition: 0.3s; }
        .player-card.active { border-color: var(--accent); background: rgba(0, 210, 255, 0.2); transform: scale(1.05); }
        .key-badge { background: #ff9f43; color: black; padding: 2px 8px; border-radius: 5px; font-weight: bold; font-size: 14px; margin-top: 5px; display: inline-block; }
        
        #game-ui { position: absolute; top: 0; width: 100%; text-align: center; pointer-events: none; display: none; }
        canvas { display: block; background: #16213e; margin: auto; box-shadow: 0 0 50px rgba(0,0,0,0.5); cursor: crosshair; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="pin-container">CODE : 127 904</div>
        <h1 id="lobby-msg">Appuie sur une touche pour rejoindre !</h1>
        <div class="grid" id="player-grid"></div>
        <p style="margin-top: 20px; color: #aaa;">Minimum 2 joueurs pour commencer (ESPACE)</p>
    </div>

    <div id="game-ui">
        <h1 id="game-title" style="font-size: 40px; text-shadow: 2px 2px #000;">TITRE DU JEU</h1>
        <div id="game-scores" style="display: flex; justify-content: center; gap: 15px;"></div>
    </div>
    <canvas id="gameCanvas" class="hidden"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1000;
    canvas.height = 700;

    const COLORS = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A8E6CF', '#FF8C42', '#764BA2', '#00D2FF', '#FC6767', '#54a0ff', '#5f27cd'];
    let players = [];
    let currentState = "LOBBY";
    let activeGame = null;
    let mouseX = 0, mouseY = 0, mouseIsDown = false;

    // Initialisation des 10 joueurs
    const grid = document.getElementById('player-grid');
    for(let i=0; i<10; i++) {
        players.push({
            id: i, active: false, color: COLORS[i], score: 0, 
            key: null, x: 0, y: 0, alive: true, score_round: 0
        });
        grid.innerHTML += `
            <div class="player-card" id="card-${i}">
                <div style="font-size:30px">👤</div>
                <div>Joueur ${i+1}</div>
                <div id="key-${i}" class="key-badge">En attente...</div>
            </div>
        `;
    }

    // --- GESTION DES ENTRÉES ---
    window.addEventListener('keydown', e => {
        if(currentState === "LOBBY") {
            if(e.code === 'Space') {
                if(players.filter(p => p.active).length >= 2) startGame();
                return;
            }
            // Assigner une touche à un joueur
            if(!players.find(p => p.key === e.key)) {
                let p = players.find(p => !p.active);
                if(p) {
                    p.active = true; p.key = e.key;
                    document.getElementById(`card-${p.id}`).classList.add('active');
                    document.getElementById(`key-${p.id}`).innerText = e.key.toUpperCase();
                }
            }
        } else if(currentState === "PLAYING" && activeGame.onKey) {
            activeGame.onKey(e.key);
        }
    });

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', () => mouseIsDown = true);
    canvas.addEventListener('mouseup', () => mouseIsDown = false);

    // --- LES 10 MINI-JEUX ---

    class GameBase {
        constructor(name, duration) { this.name = name; this.duration = duration; this.timeLeft = duration; }
        updateBase(dt) { this.timeLeft -= dt; return this.timeLeft <= 0; }
    }

    // 1. Sniper Souris (Souris)
    class Sniper extends GameBase {
        constructor() { super("SNIPER : SURVIVEZ AU CLIC !", 7000); }
        init() { players.forEach(p => { p.x = Math.random()*900+50; p.y = Math.random()*600+50; p.alive = true; }); }
        update(dt) {
            if(mouseIsDown) {
                players.forEach(p => { if(p.active && Math.hypot(p.x-mouseX, p.y-mouseY) < 30) p.alive = false; });
            }
            return this.updateBase(dt);
        }
        draw() {
            players.filter(p => p.active && p.alive).forEach(p => {
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, 7); ctx.fill();
            });
            ctx.strokeStyle = "red"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mouseX, mouseY, 30, 0, 7); ctx.stroke();
        }
    }

    // 2. Click Race (Clavier)
    class ClickRace extends GameBase {
        constructor() { super("CLAVIER : MITRAILLEZ VOTRE TOUCHE !", 5000); }
        init() { players.forEach(p => { p.score_round = 0; p.x = 100 + p.id*80; p.y = 600; }); }
        onKey(k) { let p = players.find(pl => pl.key === k); if(p) { p.score_round++; p.y -= 10; } }
        update(dt) { return this.updateBase(dt); }
        draw() { players.filter(p => p.active).forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 50, 50); }); }
    }

    // 3. Esquive (Clavier)
    class Dodge extends GameBase {
        constructor() { super("ESQUIVE : NE TOUCHE PAS LE CENTRE", 8000); }
        init() { players.forEach(p => { p.x = Math.random()*900; p.y = Math.random()*600; p.alive = true; }); }
        update(dt) {
            players.forEach(p => { if(p.active && Math.hypot(p.x-500, p.y-350) < 100) p.alive = false; });
            return this.updateBase(dt);
        }
        draw() {
            ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(500, 350, 100, 0, 7); ctx.fill();
            players.filter(p => p.active && p.alive).forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 20, 20); });
        }
    }

    // 4. Collecte (Souris)
    class Collect extends GameBase {
        constructor() { super("SOURIS : PASSEZ SUR VOTRE COULEUR", 8000); this.targets = []; }
        init() { for(let i=0; i<20; i++) this.targets.push({x:Math.random()*900, y:Math.random()*600, c:COLORS[Math.floor(Math.random()*10)]}); }
        update(dt) {
            this.targets = this.targets.filter(t => {
                if(Math.hypot(t.x-mouseX, t.y-mouseY) < 30) {
                    let p = players.find(pl => pl.color === t.c);
                    if(p) p.score_round++; return false;
                }
                return true;
            });
            return this.updateBase(dt);
        }
        draw() { this.targets.forEach(t => { ctx.fillStyle = t.c; ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, 7); ctx.fill(); }); }
    }

    // Ajoutez ici les 6 autres jeux sur le même modèle... (Simplifié pour la place)
    class Simon extends GameBase { constructor() { super("MEMOIRE : NE BOUGEZ PAS", 5000); } update(dt) { return this.updateBase(dt); } draw() { ctx.fillStyle="white"; ctx.fillText("RESTEZ IMMOBILE", 500, 350); players.filter(p=>p.active).forEach(p=> {ctx.fillStyle=p.color; ctx.arc(500,350,20,0,7); ctx.fill();}); } }

    // --- MOTEUR DE JEU ---

    function startGame() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('gameCanvas').classList.remove('hidden');
        document.getElementById('game-ui').style.display = 'block';
        currentState = "PLAYING";
        nextRound();
    }

    function nextRound() {
        const games = [Sniper, ClickRace, Dodge, Collect, Simon];
        activeGame = new games[Math.floor(Math.random()*games.length)]();
        activeGame.init ? activeGame.init() : null;
        document.getElementById('game-title').innerText = activeGame.name;
        updateScoreBoard();
    }

    function updateScoreBoard() {
        const div = document.getElementById('game-scores');
        div.innerHTML = players.filter(p => p.active).map(p => `<span style="color:${p.color}">P${p.id+1}: ${p.score}</span>`).join(' | ');
    }

    let lastTime = 0;
    function loop(t) {
        let dt = t - lastTime; lastTime = t;
        ctx.clearRect(0,0,1000,700);
        if(currentState === "PLAYING") {
            if(activeGame.update(dt)) {
                players.forEach(p => { if(p.active && p.alive) p.score++; });
                nextRound();
            }
            activeGame.draw();
            if(activeGame.name.includes("CLAVIER") || activeGame.name.includes("ESQUIVE")) {
                players.filter(p => p.active).forEach(p => {
                    // Mouvement basique pour les jeux clavier
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, 7); ctx.fill();
                });
            }
        }
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

</script>
</body>
</html>
