<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Party - 8P Full Controls</title>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #lobby { background: #1e1e26; padding: 30px; border-radius: 15px; text-align: center; width: 900px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .p-card { background: #2a2a35; padding: 15px; border-radius: 10px; border: 2px solid #333; transition: 0.3s; }
        .p-card.active { border-color: #00d2ff; background: #1e3a45; }
        canvas { background: #000; border: 4px solid #333; display: none; cursor: crosshair; }
        .hud { position: absolute; top: 10px; left: 10px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>LOBBY GARTIC STYLE</h1>
        <p>Utilisez vos touches (ZSQD, Flèches...) pour rejoindre !</p>
        <div class="grid" id="playerGrid"></div>
        <button id="startBtn" style="padding:15px 50px; font-size:20px; cursor:pointer; background:#2ed573; border:none; border-radius:30px; color:white; font-weight:bold;">LANCER</button>
    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- JOUEURS ET TOUCHES ---
const configs = [
    {id: 1, c: '#ff4757', keys: {u:'z', d:'s', l:'q', r:'d'}},
    {id: 2, c: '#2ed573', keys: {u:'arrowup', d:'arrowdown', l:'arrowleft', r:'arrowright'}},
    {id: 3, c: '#1e90ff', keys: {u:'i', d:'k', l:'j', r:'l'}},
    {id: 4, c: '#ffa502', keys: {u:'8', d:'5', l:'4', r:'6'}},
    {id: 5, c: '#ff6fcf', keys: {u:'t', d:'g', l:'f', r:'h'}},
    {id: 6, c: '#70a1ff', keys: {u:'y', d:'h', l:'g', r:'j'}},
    {id: 7, c: '#747d8c', keys: {u:'p', d:'m', l:'l', r:'ù'}},
    {id: 8, c: '#eccc68', keys: {u:'o', d:'l', l:'k', r:'m'}}
];

let players = configs.map(cfg => ({
    ...cfg, joined: false, x: 500, y: 300, vx:0, vy:0, alive: true, score: 0,
    inputs: {u:false, d:false, l:false, r:false, click: false},
    mx: 0, my: 0 // Position souris pour viser
}));

// --- GESTION DU LOBBY ---
function updateLobby() {
    const grid = document.getElementById('playerGrid');
    grid.innerHTML = players.map(p => `
        <div class="p-card ${p.joined ? 'active' : ''}">
            <div style="width:30px; height:30px; background:${p.c}; border-radius:50%; margin:0 auto 10px;"></div>
            <b>JOUEUR ${p.id}</b><br>
            <small>${p.joined ? 'PRÊT !' : 'Appuyez sur ' + p.keys.u.toUpperCase()}</small>
        </div>
    `).join('');
}
updateLobby();

// --- MINI-JEUX MANUELS ---
const GameLib = [
    {
        name: "SHOOTER ARENA",
        bullets: [],
        init: () => {
            players.forEach((p, i) => { p.x = 100 + (i%4)*200; p.y = (i<4?100:500); p.alive = p.joined; });
            GameLib[0].bullets = [];
        },
        update: () => {
            const g = GameLib[0];
            players.forEach(p => {
                if (!p.alive) return;
                // Move
                if (p.inputs.u) p.y -= 4; if (p.inputs.d) p.y += 4;
                if (p.inputs.l) p.x -= 4; if (p.inputs.r) p.x += 4;
                // Shoot
                if (p.inputs.click) {
                    const angle = Math.atan2(p.my - p.y, p.mx - p.x);
                    g.bullets.push({x:p.x, y:p.y, vx: Math.cos(angle)*8, vy:Math.sin(angle)*8, owner:p.id});
                    p.inputs.click = false; // Tir par clic
                }
            });
            g.bullets.forEach((b, bi) => {
                b.x += b.vx; b.y += b.vy;
                players.forEach(p => {
                    if (p.alive && p.id !== b.owner && Math.hypot(p.x-b.x, p.y-b.y) < 20) {
                        p.alive = false; g.bullets.splice(bi, 1);
                    }
                });
            });
        },
        draw: () => {
            GameLib[0].bullets.forEach(b => { ctx.fillStyle="white"; ctx.fillRect(b.x, b.y, 5, 5); });
        }
    },
    {
        name: "COLLECTE DE PIÈCES",
        coins: [],
        init: () => {
            players.forEach(p => { p.x = Math.random()*800; p.y = Math.random()*500; p.alive = p.joined; });
            GameLib[1].coins = Array.from({length: 10}, () => ({x: Math.random()*900, y: Math.random()*500}));
        },
        update: () => {
            players.forEach(p => {
                if (p.inputs.u) p.y -= 5; if (p.inputs.d) p.y += 5;
                if (p.inputs.l) p.x -= 5; if (p.inputs.r) p.x += 5;
                GameLib[1].coins.forEach((c, ci) => {
                    if (Math.hypot(p.x - c.x, p.y - c.y) < 30) {
                        p.score++; GameLib[1].coins.splice(ci, 1);
                        GameLib[1].coins.push({x: Math.random()*900, y: Math.random()*500});
                    }
                });
            });
        },
        draw: () => {
            GameLib[1].coins.forEach(c => { ctx.fillStyle="gold"; ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, Math.PI*2); ctx.fill(); });
        }
    }
];

let currentGame = null;
let isStarted = false;

function nextGame() {
    currentGame = GameLib[Math.floor(Math.random() * GameLib.length)];
    currentGame.init();
}

// --- ÉVÉNEMENTS ---
window.onkeydown = (e) => {
    const k = e.key.toLowerCase();
    if (k === 'n' && isStarted) return nextGame(); // TOUCHE N POUR CHANGER
    
    players.forEach(p => {
        if (k === p.keys.u) { p.inputs.u = true; p.joined = true; updateLobby(); }
        if (k === p.keys.d) p.inputs.d = true;
        if (k === p.keys.l) p.inputs.l = true;
        if (k === p.keys.r) p.inputs.r = true;
    });
};
window.onkeyup = (e) => {
    const k = e.key.toLowerCase();
    players.forEach(p => {
        if (k === p.keys.u) p.inputs.u = false;
        if (k === p.keys.d) p.inputs.d = false;
        if (k === p.keys.l) p.inputs.l = false;
        if (k === p.keys.r) p.inputs.r = false;
    });
};
window.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    players.forEach(p => { p.mx = e.clientX - rect.left; p.my = e.clientY - rect.top; });
};
window.onmousedown = () => players.forEach(p => p.inputs.click = true);

document.getElementById('startBtn').onclick = () => {
    if (!players.some(p => p.joined)) return;
    document.getElementById('lobby').style.display = 'none';
    canvas.style.display = 'block';
    isStarted = true;
    nextGame();
    loop();
};

function loop() {
    ctx.fillStyle = "#111"; ctx.fillRect(0, 0, 1000, 600);
    currentGame.update();
    currentGame.draw();
    
    players.forEach(p => {
        if (!p.joined || !p.alive) return;
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
        // Ligne de visée (souris)
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.mx, p.my); ctx.stroke();
    });
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
