<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gartic Party - Debug Edition</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #menu { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 450px; border: 2px solid #334155; }
        .btn { color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-share { background: #6366f1; }
        .btn-green { background: #22c55e; display: none; }
        canvas { background: #000; display: none; border: 4px solid #38bdf8; }
        #debug-log { position: fixed; bottom: 10px; left: 10px; font-size: 10px; color: #4ade80; max-height: 100px; overflow: scroll; }
    </style>
</head>
<body>

    <div id="debug-log">Log: Initialisation...</div>

    <div id="menu">
        <h1 style="color:#38bdf8;">TEST MULTI 8P</h1>
        <button class="btn btn-share" onclick="copyInviteLink()">🔗 COPIER LE LIEN</button>
        <p id="conn-status">Statut : En attente...</p>
        <button id="startBtn" class="btn btn-green" onclick="hostStart()">FORCER LE LANCEMENT</button>
    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>

<script>
const log = (msg) => { document.getElementById('debug-log').innerHTML += "<br>" + msg; console.log(msg); };
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const peer = new Peer();

let myId, conn, isHost = false, myIndex = 0;
let connections = [];
let players = Array.from({length: 8}, (_, i) => ({ 
    id: i, x: 500, y: 300, active: false, alive: true,
    color: ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6fcf', '#70a1ff', '#747d8c', '#eccc68'][i] 
}));
let tiles = new Array(240).fill(0);

peer.on('open', (id) => {
    myId = id;
    log("Mon ID : " + id);
    const room = new URLSearchParams(window.location.search).get('room');
    if (room) {
        log("Rejoint le salon : " + room);
        isHost = false;
        conn = peer.connect(room);
        setupListener(conn);
    } else {
        log("Je suis l'Hôte");
        isHost = true;
        players[0].active = true;
        document.getElementById('startBtn').style.display = 'block';
    }
});

function copyInviteLink() {
    const url = new URL(window.location.href);
    url.searchParams.set('room', myId);
    navigator.clipboard.writeText(url.toString());
    alert("Lien copié !");
}

peer.on('connection', (c) => {
    log("Nouveau joueur connecté !");
    connections.push(c);
    let idx = connections.length;
    players[idx].active = true;
    c.on('open', () => {
        c.send({ type: 'INIT', index: idx, p: players });
        setupListener(c);
    });
});

function setupListener(c) {
    c.on('data', (data) => {
        if (data.type === 'INIT') {
            log("Reçu INIT - Index : " + data.index);
            myIndex = data.index;
            players = data.p;
            document.getElementById('menu').innerHTML = "<h1>CONNECTÉ !</h1><p>L'hôte va lancer...</p>";
        }
        if (data.type === 'START') startGame();
        if (data.type === 'SYNC') {
            players = data.p;
            tiles = data.t;
        }
        if (isHost && data.type === 'MOVE') {
            players[data.idx].x = data.x;
            players[data.idx].y = data.y;
        }
    });
}

function hostStart() {
    log("Lancement global...");
    connections.forEach(c => c.send({ type: 'START' }));
    startGame();
}

function startGame() {
    document.getElementById('menu').style.display = 'none';
    canvas.style.display = 'block';
    loop();
}

let keys = {};
window.onkeydown = e => keys[e.key.toLowerCase()] = true;
window.onkeyup = e => keys[e.key.toLowerCase()] = false;

function loop() {
    let me = players[myIndex];
    if (me && me.alive) {
        if (keys['z'] || keys['arrowup']) me.y -= 5;
        if (keys['s'] || keys['arrowdown']) me.y += 5;
        if (keys['q'] || keys['arrowleft']) me.x -= 5;
        if (keys['d'] || keys['arrowright']) me.x += 5;

        if (isHost) {
            checkSpleef(me);
        } else if (conn) {
            conn.send({ type: 'MOVE', idx: myIndex, x: me.x, y: me.y });
        }
    }

    if (isHost) {
        connections.forEach((c, i) => { if(players[i+1].active) checkSpleef(players[i+1]); });
        connections.forEach(c => c.send({ type: 'SYNC', p: players, t: tiles }));
    }

    draw();
    requestAnimationFrame(loop);
}

function checkSpleef(p) {
    let tx = Math.floor(p.x / 50), ty = Math.floor(p.y / 50);
    let idx = ty * 20 + tx;
    if (tiles[idx] === 0) {
        tiles[idx] = 1;
        setTimeout(() => tiles[idx] = 2, 500);
    }
    if (tiles[idx] === 2) p.alive = false;
}

function draw() {
    ctx.clearRect(0, 0, 1000, 600);
    for(let i=0; i<tiles.length; i++) {
        if (tiles[i] === 2) continue;
        ctx.fillStyle = tiles[i] === 1 ? "#f59e0b" : "#1e293b";
        ctx.fillRect((i % 20) * 50, Math.floor(i / 20) * 50, 48, 48);
    }
    players.forEach(p => {
        if (p.active && p.alive) {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.stroke();
        }
    });
}
</script>
</body>
</html>
