<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gartic Party 100</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --panel: #2d3436; --accent: #fdcb6e; --bg: #6c5ce7; }
        body { background: var(--bg); color: white; font-family: 'Comic Sans MS', cursive; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        /* LOBBY STYLE GARTIC PHONE */
        #lobby { background: white; color: #2d3436; padding: 30px; border-radius: 25px; width: 80%; max-width: 900px; box-shadow: 0 15px 0 rgba(0,0,0,0.2); text-align: center; }
        .player-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 20px; margin: 25px 0; }
        .p-slot { background: #dfe6e9; padding: 15px; border-radius: 15px; border-bottom: 5px solid #b2bec3; position: relative; }
        .p-slot.active { background: #55efc4; border-color: #00b894; transform: translateY(-5px); }
        .avatar { font-size: 40px; display: block; margin-bottom: 10px; }
        
        /* JEU & GRAPHISMES */
        #game-area { display: none; width: 100%; height: 100%; position: relative; background: #1a1a2e; }
        canvas { background: #242442; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.5); border: 8px solid #3d3d5e; }
        #ui-layer { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        .timer-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.1); position: absolute; bottom: 0; }
        .timer-fill { height: 100%; background: var(--accent); width: 100%; transition: width 0.1s linear; }

        /* EFFET BUG */
        .glitch { animation: glitch 0.2s infinite; filter: contrast(200%) brightness(150%); }
        @keyframes glitch { 
            0% { transform: translate(0); } 
            20% { transform: translate(-5px, 5px); } 
            80% { transform: translate(5px, -5px); } 
        }
        
        .btn { background: #ff7675; border: none; padding: 15px 30px; color: white; border-radius: 50px; font-size: 20px; cursor: pointer; font-weight: bold; border-bottom: 5px solid #d63031; transition: 0.1s; }
        .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 style="font-size: 40px; color: var(--bg);">GARTIC PARTY <span id="pin-display" style="background:var(--bg); color:white; padding:5px 15px; border-radius:10px;">...</span></h1>
        <p>Partage l'URL avec tes potes !</p>
        
        <div id="join-controls">
            <input type="text" id="input-pin" placeholder="CODE" style="padding:15px; border-radius:10px; border:2px solid #ccc;">
            <button class="btn" onclick="joinGame()">REJOINDRE</button>
        </div>

        <div class="player-list" id="player-grid"></div>
        <button id="start-btn" class="btn" style="display:none; background:#55efc4; border-color:#00b894;">LANCER LA PARTIE</button>
    </div>

    <div id="game-area">
        <div id="ui-layer">
            <h1 id="game-title" style="margin:0; font-size:35px; text-shadow: 3px 3px #000;">CHARGEMENT...</h1>
            <div id="score-board"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1000; canvas.height = 650;

    let peer = null, connections = [], hostConn = null, isHost = false;
    let players = [], currentMiniGame = null, gameTimer = 0, gameMaxTime = 5000;
    let isBugged = false;
    const AVATARS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🦁','🐮'];

    // --- INITIALISATION DU LOBBY ---
    const grid = document.getElementById('player-grid');
    for(let i=0; i<10; i++) {
        players.push({ id: i, active: false, score: 0, x: 500, y: 325, color: `hsl(${i*36}, 70%, 60%)`, avatar: AVATARS[i], key: null, alive: true });
        grid.innerHTML += `<div class="p-slot" id="p${i}"><span class="avatar">${AVATARS[i]}</span><span id="n${i}">Libre</span></div>`;
    }

    // --- SYSTÈME DE JEU (GÉNÉRATEUR DE 100 JEUX) ---
    function generateGame() {
        // Aléatoire entre 1 et 100
        const gameId = Math.floor(Math.random() * 100) + 1;
        isBugged = Math.random() < 0.1; // 10% de chance de bug
        
        let type = gameId % 4; // On alterne 4 types de gameplay de base
        let titles = ["ESQUIVE", "VITESSE", "RÉFLEXE", "PRÉCISION", "COLLECTE", "SURVIE"];
        
        return {
            id: gameId,
            name: `${titles[gameId % 6]} #${gameId} ${isBugged ? '⚠ BUGGED ⚠' : ''}`,
            type: type,
            speed: 1 + (gameId * 0.05) + (isBugged ? 2 : 0),
            duration: isBugged ? 3000 : 6000
        };
    }

    // --- RÉSEAU ---
    function initHost() {
        isHost = true;
        const pin = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('pin-display').innerText = pin;
        peer = new Peer('GP-' + pin);
        
        peer.on('connection', conn => {
            connections.push(conn);
            conn.on('data', data => {
                if(data.type === 'JOIN') {
                    let p = players.find(pl => !pl.active);
                    if(p) { p.active = true; p.peerId = conn.peer; p.key = data.key; updateLobbyUI(); sync(); }
                }
                if(data.type === 'INPUT') {
                    let p = players.find(pl => pl.peerId === conn.peer);
                    if(p && p.alive) { p.y -= 15 * (currentMiniGame ? currentMiniGame.speed : 1); }
                }
            });
        });
        document.getElementById('start-btn').onclick = () => { broadcast({type:'START'}); start(); };
    }

    function joinGame() {
        const pin = document.getElementById('input-pin').value;
        peer = new Peer();
        peer.on('open', () => {
            hostConn = peer.connect('GP-' + pin);
            hostConn.on('open', () => {
                document.getElementById('lobby').innerHTML = "<h1>TOUCHE UNE TOUCHE POUR REJOINDRE !</h1>";
                window.addEventListener('keydown', e => {
                    hostConn.send({ type: 'JOIN', key: e.key });
                    document.getElementById('lobby').innerHTML = "<h1>PRÊT ! REGARDE L'ÉCRAN HÔTE</h1>";
                }, {once: true});
            });
            hostConn.on('data', d => { 
                if(d.type === 'SYNC') { players = d.players; currentMiniGame = d.game; gameTimer = d.timer; isBugged = d.bug; }
                if(d.type === 'START') start();
            });
        });
    }

    // --- BOUCLE DE JEU ---
    function start() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        if(isHost) next();
        loop();
    }

    function next() {
        currentMiniGame = generateGame();
        gameTimer = 0; gameMaxTime = currentMiniGame.duration;
        players.forEach(p => { p.x = 100 + (Math.random()*800); p.y = 500; p.alive = true; });
    }

    function loop() {
        if(isHost) {
            gameTimer += 16;
            // Sécurité : si le timer dépasse ou bug, on force le suivant
            if(gameTimer > gameMaxTime + 1000) next(); 
            
            players.forEach(p => { 
                p.y += 2 * (currentMiniGame.speed); // Gravité
                if(p.y > 650) p.alive = false; 
            });
            
            if(gameTimer >= gameMaxTime) {
                players.forEach(p => { if(p.alive) p.score++; });
                next();
            }
            sync();
        }
        draw();
        requestAnimationFrame(loop);
    }

    function draw() {
        ctx.clearRect(0,0,1000,650);
        if(isBugged) canvas.classList.add('glitch'); else canvas.classList.remove('glitch');

        document.getElementById('game-title').innerText = currentMiniGame ? currentMiniGame.name : "";
        document.getElementById('timer-fill').style.width = (100 - (gameTimer/gameMaxTime)*100) + "%";

        players.filter(p => p.active).forEach(p => {
            if(!p.alive) return;
            // Graphismes plus beaux : cercles avec ombres
            ctx.shadowBlur = 15; ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "white"; ctx.font = "20px Arial";
            ctx.fillText(p.avatar, p.x-15, p.y+8);
        });
    }

    function sync() { broadcast({ type:'SYNC', players, game: currentMiniGame, timer: gameTimer, bug: isBugged }); }
    function broadcast(d) { connections.forEach(c => c.send(d)); }
    function updateLobbyUI() {
        players.forEach((p, i) => {
            if(p.active) {
                document.getElementById('p'+i).classList.add('active');
                document.getElementById('n'+i).innerText = "PRÊT !";
            }
        });
        if(players.filter(p=>p.active).length >= 1) document.getElementById('start-btn').style.display = 'inline-block';
    }

    // Lancer en tant qu'hôte par défaut
    if(!window.location.hash) initHost();
</script>
</body>
</html>
