<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mega Party - Ultra Sync 8P</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #menu { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 450px; border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 1.1em; }
        .btn-share { background: #6366f1; border-bottom: 4px solid #4338ca; }
        .btn-green { background: #22c55e; display: none; border-bottom: 4px solid #15803d; }
        canvas { background: #000; display: none; border: 4px solid #334155; border-radius: 10px; }
        #status-bar { position: absolute; top: 10px; font-size: 0.8em; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="status-bar">Initialisation PeerJS...</div>

    <div id="menu">
        <h1 style="color:#38bdf8; margin:0;">MEGA PARTY ONLINE</h1>
        <p>Invite tes amis pour jouer à 8 !</p>
        <button class="btn btn-share" onclick="copyInviteLink()">🔗 COPIER LE LIEN D'INVITATION</button>
        <div id="player-list" style="margin-top:20px; color:#94a3b8;">Attente de connexion...</div>
        <button id="startBtn" class="btn btn-green" onclick="hostStart()">LANCER LE JEU</button>
    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const peer = new Peer();

let myId, conn, isHost = false, myIndex = 0;
let connections = [];
let players = Array.from({length: 8}, (_, i) => ({ 
    id: i, x: 0, y: 0, active: false, alive: true,
    color: ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6fcf', '#70a1ff', '#747d8c', '#eccc68'][i] 
}));
let tiles = new Array(240).fill(0);

// --- RÉSEAU ---
peer.on('open', (id) => {
    myId = id;
    document.getElementById('status-bar').innerText = "Connecté au serveur. ID: " + id;
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room');
    if (room) {
        isHost = false;
        conn = peer.connect(room);
        setupListener(conn);
    } else {
        isHost = true;
        players[0].active = true;
        document.getElementById('player-list').innerText = "Joueurs : 1/8 (Toi)";
    }
});

function copyInviteLink() {
    const url = new URL(window.location.href);
    url.searchParams.set('room', myId);
    navigator.clipboard.writeText(url.toString());
    alert("Lien copié ! Envoie-le à ton autre ordinateur.");
}

peer.on('connection', (c) => {
    connections.push(c);
    const newIdx = connections.length;
    players[newIdx].active = true;
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('player-list').innerText = `Joueurs : ${newIdx + 1}/8`;
    
    c.on('open', () => {
        c.send({ type: 'INIT', index: newIdx, players: players });
        setupListener(c);
    });
});

function setupListener(c) {
    c.on('data', (data) => {
        if (data.type === 'INIT') {
            myIndex = data.index;
            players = data.players;
            document.getElementById('menu').innerHTML = "<h2>PRÊT !</h2><p>Attente de l'hôte...</p>";
        }
        if (data.type === 'START') startGame();
        if (data.type === 'SYNC') {
            players = data.p;
            tiles = data.t;
        }
        if (isHost && data.type === 'INPUT') {
            players[data.index].x = data.x;
            players[data.index].y = data.y;
        }
    });
}

// --- LOGIQUE JEU ---
function hostStart() {
    connections.forEach(c => c.send({ type: 'START' }));
    startGame();
}

function startGame() {
    document.getElementById('menu').style.display = 'none';
    canvas.style.display = 'block';
    if(isHost) {
        tiles.fill(0);
        players.forEach((p, i) => { if(p.active) { p.x = 100 + i*100; p.y = 300; p.alive = true; } });
    }
    loop();
}

let keys = {};
window.onkeydown = e => keys[e.key.toLowerCase()] = true;
window.onkeyup = e => keys[e.key.toLowerCase()] = false;

function loop() {
    let me = players[myIndex];
    if (me && me.alive) {
        if (keys['z'] || keys['arrowup']) me.y -= 5;
        if (keys['s'] || keys['arrowdown']) me.y += 5;
        if (keys['q'] || keys['arrowleft']) me.x -= 5;
        if (keys['d'] || keys['arrowright']) me.x += 5;
        
        me.x = Math.max(15, Math.min(985, me.x));
        me.y = Math.max(15, Math.min(585, me.y));

        if (!isHost && conn) {
            conn.send({ type: 'INPUT', index: myIndex, x: me.x, y: me.y });
        }
    }

    if (isHost) {
        // L'hôte gère les dalles pour tout le monde
        players.forEach(p => {
            if (p.active && p.alive) {
                let tx = Math.floor(p.x / 50), ty = Math.floor(p.y / 50);
                let idx = ty * 20 + tx;
                if (tiles[idx] === 0) {
                    tiles[idx] = 1;
                    setTimeout(() => tiles[idx] = 2, 600);
                }
                if (tiles[idx] === 2) p.alive = false;
            }
        });
        connections.forEach(c => c.send({ type: 'SYNC', p: players, t: tiles }));
    }

    draw();
    requestAnimationFrame(loop);
}

function draw() {
    ctx.clearRect(0, 0, 1000, 600);
    // Sol
    for(let i=0; i<tiles.length; i++) {
        if (tiles[i] === 2) continue;
        ctx.fillStyle = tiles[i] === 1 ? "#f59e0b" : "#334155";
        ctx.fillRect((i % 20) * 50, Math.floor(i / 20) * 50, 48, 48);
    }
    // Joueurs
    players.forEach(p => {
        if (p.active && p.alive) {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "white"; ctx.font = "bold 12px Arial";
            ctx.fillText("J"+(p.id+1), p.x - 8, p.y - 25);
        }
    });
}
</script>
</body>
</html>
