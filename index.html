<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Party - Online 8P</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #setup { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; text-align: center; font-size: 1.1em; }
        .btn { background: #38bdf8; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-start { background: #22c55e; margin-top: 20px; display: none; }
        canvas { background: #000; display: none; border: 4px solid #334155; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        #ui-layer { position: absolute; top: 10px; text-align: center; width: 100%; pointer-events: none; display: none; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h2 id="game-name">ATTENTE...</h2>
        <p>Appuyez sur <b style="color:#38bdf8">N</b> pour changer de jeu</p>
    </div>

    <div id="setup">
        <h1>PARTY ONLINE</h1>
        <p>Ton Code Salon : <br><b id="my-id" style="color:#38bdf8; font-size: 1.5em;">Génération...</b></p>
        <hr style="border: 0.1px solid #334155; margin: 20px 0;">
        <input type="text" id="join-id" placeholder="Code de l'ami">
        <button class="btn" onclick="joinRoom()">REJOINDRE</button>
        <div id="peer-count" style="margin-top:15px; font-size:0.9em; color:#94a3b8;">Joueurs connectés : 1</div>
        <button id="startBtn" class="btn btn-start" onclick="broadcastStart()">LANCER LA PARTIE</button>
    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const peer = new Peer();
let conn = null;
let connections = [];
let isHost = false;
let gameState = "LOBBY";

// --- CONFIG DES 8 JOUEURS ---
const playerColors = ['#ef4444', '#22c55e', '#3b82f6', '#eab308', '#a855f7', '#06b6d4', '#f97316', '#f87171'];
let players = Array.from({length: 8}, (_, i) => ({
    id: i, x: 0, y: 0, color: playerColors[i], alive: true, score: 0, paint: 0
}));
let myPlayerId = 0;

// --- RÉSEAU ---
peer.on('open', id => document.getElementById('my-id').innerText = id);

// Quand quelqu'un se connecte à nous (On devient Hôte)
peer.on('connection', c => {
    isHost = true;
    connections.push(c);
    c.on('open', () => {
        document.getElementById('peer-count').innerText = `Joueurs connectés : ${connections.length + 1}`;
        document.getElementById('startBtn').style.display = 'block';
        setupListener(c);
    });
});

function joinRoom() {
    const targetId = document.getElementById('join-id').value;
    conn = peer.connect(targetId);
    conn.on('open', () => {
        isHost = false;
        myPlayerId = 1; // Simplifié pour le test, l'hôte peut assigner les IDs
        setupListener(conn);
        document.getElementById('setup').innerHTML = "<h1>PRÊT !</h1><p>Attente du lancement par l'hôte...</p>";
    });
}

function setupListener(c) {
    c.on('data', data => {
        if(data.type === 'START') startGame(data.gameIndex);
        if(data.type === 'SYNC') players = data.players;
        if(data.type === 'SKIP') nextGame();
    });
}

// --- LOGIQUE DES JEUX ---
const gameLib = [
    {
        name: "PAINT LE SOL",
        grid: [],
        init() {
            this.grid = Array.from({length: 400}, () => -1); // 20x20 cases
            players.forEach((p, i) => { p.x = 100 + (i*100)%800; p.y = 100 + (i>3?300:0); p.paint = 0; });
        },
        update() {
            const p = players[myPlayerId];
            if(keys['z']) p.y -= 5; if(keys['s']) p.y += 5;
            if(keys['q']) p.x -= 5; if(keys['d']) p.x += 5;
            // Colorier la case
            let gx = Math.floor(p.x / 50); let gy = Math.floor(p.y / 50);
            if(gx >= 0 && gx < 20 && gy >= 0 && gy < 12) {
                this.grid[gy * 20 + gx] = myPlayerId;
            }
        },
        draw() {
            for(let i=0; i<this.grid.length; i++) {
                if(this.grid[i] !== -1) {
                    ctx.fillStyle = playerColors[this.grid[i]] + "66";
                    ctx.fillRect((i%20)*50, Math.floor(i/20)*50, 50, 50);
                }
            }
        }
    }
];

let currentGame = null;
let keys = {};

function broadcastStart() {
    let idx = Math.floor(Math.random() * gameLib.length);
    connections.forEach(c => c.send({type: 'START', gameIndex: idx}));
    startGame(idx);
}

function startGame(idx) {
    gameState = "PLAYING";
    document.getElementById('setup').style.display = 'none';
    document.getElementById('ui-layer').style.display = 'block';
    canvas.style.display = 'block';
    currentGame = gameLib[idx];
    currentGame.init();
    loop();
}

function nextGame() {
    if(!isHost) return;
    broadcastStart();
}

// --- BOUCLE ---
window.onkeydown = e => { 
    keys[e.key.toLowerCase()] = true; 
    if(e.key.toLowerCase() === 'n') {
        if(isHost) nextGame();
        else connections.forEach(c => c.send({type: 'SKIP'})); // Demande de skip
    }
};
window.onkeyup = e => keys[e.key.toLowerCase()] = false;

function loop() {
    if(gameState !== "PLAYING") return;
    ctx.clearRect(0, 0, 1000, 600);
    
    currentGame.update();
    currentGame.draw();

    // Envoi des positions à l'hôte ou aux autres
    if(isHost) {
        connections.forEach(c => c.send({type: 'SYNC', players: players}));
    } else {
        conn.send({type: 'SYNC', players: players});
    }

    players.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "white"; ctx.stroke();
    });
    
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
